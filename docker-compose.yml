# Dev: build + run the two images (agent + UI) wired over the compose network.
#
#   docker compose up --build
#   UI -> http://localhost:3000   (the only published port)
#
# LLM auth is via API KEY here (simple for dev). Put the config in
# pipeline_pulse_agent/.env:
#   - a hosted provider:  LLM_MODEL=anthropic/claude-opus-4-8  + ANTHROPIC_API_KEY=...
#                         LLM_MODEL=gemini-flash-latest        + GOOGLE_API_KEY=...
#   - self-hosted:        LLM_BASE_URL=http://host.docker.internal:8080/v1
#                         LLM_MODEL=<model served>   (llama.cpp on the host)
services:
  agent:
    build:
      context: ./pipeline_pulse_agent
    image: pp-agent
    env_file:
      - pipeline_pulse_agent/.env      # MCP_SERVER_URL, LLM_MODEL, API key / LLM_BASE_URL
    # Lets the agent reach a self-hosted LLM running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"                          # internal to the compose network only
    # ports:                            # uncomment to hit the agent directly for debugging
    #   - "8000:8000"

  ui:
    build:
      context: ./ui
    image: pp-ui
    environment:
      # Reach the agent by its compose service name.
      AGUI_BACKEND_URL: "http://agent:8000/"
    ports:
      - "3000:3000"                     # the only published port
    depends_on:
      - agent
